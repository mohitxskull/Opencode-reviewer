name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.5"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run full check (fmt, lint, typecheck, test)
        run: make check

      - name: Build standalone binary
        run: make build

      - name: Smoke-test standalone binary outside node_modules
        run: |
          cp dist/peer /tmp/peer-standalone
          chmod +x /tmp/peer-standalone
          cd /tmp
          ./peer-standalone --help
          ./peer-standalone doctor || true
