name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.5"

      - name: Verify release tag matches package.json version
        run: |
          TAG_VER="${GITHUB_REF_NAME#v}"
          PKG_VER="$(bun -e 'import p from "./package.json"; console.log(p.version)')"
          if [ "${TAG_VER}" != "${PKG_VER}" ]; then
            echo "Tag version (${TAG_VER}) does not match package.json (${PKG_VER})" >&2
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify suite before release
        run: make check

      - name: Cross-compile binaries for 5 targets
        run: |
          mkdir -p release
          bun build src/cli/index.ts --compile --target=bun-linux-x64   --outfile release/peer-linux-x64
          bun build src/cli/index.ts --compile --target=bun-linux-arm64 --outfile release/peer-linux-arm64
          bun build src/cli/index.ts --compile --target=bun-darwin-arm64 --outfile release/peer-darwin-arm64
          bun build src/cli/index.ts --compile --target=bun-darwin-x64   --outfile release/peer-darwin-x64
          bun build src/cli/index.ts --compile --target=bun-windows-x64  --outfile release/peer-windows-x64.exe

      - name: Package tarballs and SHA256SUMS.txt
        working-directory: release
        run: |
          for target in linux-x64 linux-arm64 darwin-arm64 darwin-x64; do
            cp "peer-${target}" peer
            chmod +x peer
            tar -czf "peer-${target}.tar.gz" peer
            rm -f peer "peer-${target}"
          done
          zip -q peer-windows-x64.zip peer-windows-x64.exe
          rm -f peer-windows-x64.exe
          sha256sum peer-*.tar.gz peer-*.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/peer-*.tar.gz
            release/peer-*.zip
            release/SHA256SUMS.txt
